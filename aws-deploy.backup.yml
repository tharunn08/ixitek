name: Ixitek Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ixitek-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/tharunn08/ixitek
  EC2_INSTANCE_ID: i-032a55578ef6d0f83
  AWS_REGION: ap-southeast-2
  EC2_APP_ROOT: /home/ec2-user/ixitek-config
  EC2_DATA_ROOT: /home/ec2-user/ixitek-data
  NGINX_UPSTREAM_FILE: /etc/nginx/conf.d/ixitek-upstream.conf
  NGINX_CONFIG_FILE: /etc/nginx/conf.d/ixitek.conf
  BLUE_PORT: 5001
  GREEN_PORT: 5002

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================

  test:
    name: Test application
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db_image:
          - mysql:8.0
          - mariadb:10.11

    services:
      mysql:
        image: ${{ matrix.db_image }}

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ixitek_test
          MYSQL_USER: ixitek
          MYSQL_PASSWORD: ixitek

        ports:
          - 3306:3306

        options: >-
          --health-cmd="sh -c
          'if command -v mysqladmin >/dev/null 2>&1;
          then mysqladmin ping -h 127.0.0.1 -proot;
          else healthcheck.sh --connect --innodb_initialized;
          fi'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ixitek
      DB_PASSWORD: ixitek
      DB_NAME: ixitek_test
      DB_NAME_TEST: ixitek_test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ixitek-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix ixitek-backend

      - name: Create restore-test database
        run: |
          docker exec \
            ${{ job.services.mysql.id }} \
            sh -c '
              if command -v mysql >/dev/null 2>&1; then
                M=mysql
              else
                M=mariadb
              fi

              $M -uroot -proot -e "
                CREATE DATABASE IF NOT EXISTS ixitek_restore_test;
                GRANT ALL ON ixitek_restore_test.* TO '\''ixitek'\''@'\''%'\'';
              "
            '

      - name: Run backend tests
        run: npm test --prefix ixitek-backend

      - name: Install frontend dependencies
        run: npm ci --prefix ixitek-frontend --include=dev

      - name: Lint frontend
        run: npm run lint --prefix ixitek-frontend

      - name: Build frontend
        run: npm run build --prefix ixitek-frontend


  # ============================================================
  # 2. BUILD + SECURITY SCAN + PUSH
  # ============================================================

  build:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable Docker image
        run: |
          docker build \
            --pull \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push immutable image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update latest tag
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:latest

          docker push ${{ env.IMAGE_NAME }}:latest


  # ============================================================
  # 3. BLUE/GREEN PRODUCTION DEPLOYMENT
  # ============================================================

  deploy:
    name: Blue/Green production deployment
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: production
      url: https://aws.ixitek.com

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: IxitekProductionDeployment

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Prepare deployment script
      # --------------------------------------------------------

      - name: Create deployment script
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |

          cat > /tmp/ixitek-deploy.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash

          set -Eeuo pipefail

          IMAGE="__IXITEK_IMAGE__"

          echo "========================================"
          echo "IXITEK PRODUCTION DEPLOYMENT"
          echo "========================================"

          echo
          echo "Image:"
          echo "$IMAGE"

          # ------------------------------------------------------
          # Load GHCR credentials from EC2
          # ------------------------------------------------------

          GHCR_ENV="/home/ec2-user/ixitek-config/ghcr.env"

          if [[ ! -f "$GHCR_ENV" ]]; then
            echo "ERROR: GHCR credential file not found:"
            echo "$GHCR_ENV"
            exit 1
          fi

          # shellcheck disable=SC1090
          source "$GHCR_ENV"

          if [[ -z "${GHCR_USERNAME:-}" ]]; then
            echo "ERROR: GHCR_USERNAME is missing."
            exit 1
          fi

          if [[ -z "${GHCR_TOKEN:-}" ]]; then
            echo "ERROR: GHCR_TOKEN is missing."
            exit 1
          fi

          # ------------------------------------------------------
          # Determine currently active environment
          # ------------------------------------------------------

          CURRENT_PORT="$(sudo awk '
            /server 127\.0\.0\.1:(5001|5002);/ {
              sub(/.*server 127\.0\.0\.1:/, "", $0)
              sub(/;.*/, "", $0)
              print $0
              exit
            }
          ' /etc/nginx/conf.d/ixitek-upstream.conf)"

          if [[ "$CURRENT_PORT" == "5001" ]]; then

            ACTIVE_ENV="blue"
            ACTIVE_CONTAINER="ixitek-blue"
            ACTIVE_PORT="5001"

            TARGET_ENV="green"
            TARGET_CONTAINER="ixitek-green"
            TARGET_PORT="5002"

          elif [[ "$CURRENT_PORT" == "5002" ]]; then

            ACTIVE_ENV="green"
            ACTIVE_CONTAINER="ixitek-green"
            ACTIVE_PORT="5002"

            TARGET_ENV="blue"
            TARGET_CONTAINER="ixitek-blue"
            TARGET_PORT="5001"

          else

            echo "ERROR: Unknown active port: $CURRENT_PORT"
            exit 1

          fi

          echo
          echo "Current environment : $ACTIVE_ENV"
          echo "Current container   : $ACTIVE_CONTAINER"
          echo "Current port        : $ACTIVE_PORT"

          echo
          echo "Target environment  : $TARGET_ENV"
          echo "Target container    : $TARGET_CONTAINER"
          echo "Target port         : $TARGET_PORT"

          # ------------------------------------------------------
          # Login to GHCR
          # ------------------------------------------------------

          echo
          echo "Logging into GHCR..."

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password-stdin

          # ------------------------------------------------------
          # Pull exact immutable image
          # ------------------------------------------------------

          echo
          echo "Pulling immutable image..."

          docker pull "$IMAGE"

          # ------------------------------------------------------
          # Remove stale target container
          # ------------------------------------------------------

          echo
          echo "Cleaning stale target container..."

          docker rm -f "$TARGET_CONTAINER" 2>/dev/null || true

          # ------------------------------------------------------
          # Start new environment
          # ------------------------------------------------------

          echo
          echo "Starting $TARGET_ENV environment..."

          docker run -d \
            --name "$TARGET_CONTAINER" \
            --restart unless-stopped \
            -p "${TARGET_PORT}:5000" \
            --env-file /home/ec2-user/ixitek-config/.env \
            -v /home/ec2-user/ixitek-config/global-bundle.pem:/app/rds-global-bundle.pem:ro \
            -v /home/ec2-user/ixitek-data:/home/ec2-user/ixitek-data \
            -e DB_SSL_CA=/app/rds-global-bundle.pem \
            -e EMAIL_PROVIDER=none \
            "$IMAGE"

          # ------------------------------------------------------
          # Wait for container health
          # ------------------------------------------------------

          echo
          echo "Waiting for new container..."

          HEALTH_OK="false"

          for attempt in {1..30}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              "http://127.0.0.1:${TARGET_PORT}/api/health" \
              > /tmp/ixitek-health.json; then

              if grep -q '"ok":true' /tmp/ixitek-health.json && \
                 grep -q '"db":"up"' /tmp/ixitek-health.json; then

                HEALTH_OK="true"
                break

              fi

            fi

            echo "Health check attempt ${attempt}/30 failed."
            sleep 2

          done

          if [[ "$HEALTH_OK" != "true" ]]; then

            echo
            echo "ERROR: New environment failed health check."

            echo
            cat /tmp/ixitek-health.json 2>/dev/null || true

            echo
            echo "Container logs:"
            docker logs --tail 100 "$TARGET_CONTAINER" || true

            echo
            echo "Keeping old production environment untouched."

            docker rm -f "$TARGET_CONTAINER" || true

            exit 1

          fi

          echo
          echo "New environment health:"
          cat /tmp/ixitek-health.json

          # ------------------------------------------------------
          # Verify Docker container
          # ------------------------------------------------------

          echo
          echo "Checking container state..."

          docker inspect \
            --format='{{.State.Status}}' \
            "$TARGET_CONTAINER"

          if [[ "$(docker inspect --format='{{.State.Running}}' "$TARGET_CONTAINER")" != "true" ]]; then

            echo "ERROR: New container is not running."

            docker logs --tail 100 "$TARGET_CONTAINER" || true

            docker rm -f "$TARGET_CONTAINER" || true

            exit 1

          fi

          # ------------------------------------------------------
          # Validate Nginx before traffic switch
          # ------------------------------------------------------

          echo
          echo "Validating Nginx configuration..."

          sudo nginx -t

          # ------------------------------------------------------
          # Switch traffic
          # ------------------------------------------------------

          echo
          echo "Switching production traffic:"
          echo "$ACTIVE_PORT -> $TARGET_PORT"

          sudo sed -i \
            "s|server 127.0.0.1:${ACTIVE_PORT};|server 127.0.0.1:${TARGET_PORT};|" \
            /etc/nginx/conf.d/ixitek-upstream.conf

          # ------------------------------------------------------
          # Validate Nginx after modification
          # ------------------------------------------------------

          if ! sudo nginx -t; then

            echo
            echo "ERROR: Nginx configuration failed."

            echo "Restoring previous upstream..."

            sudo sed -i \
              "s|server 127.0.0.1:${TARGET_PORT};|server 127.0.0.1:${ACTIVE_PORT};|" \
              /etc/nginx/conf.d/ixitek-upstream.conf

            sudo nginx -t
            sudo systemctl reload nginx

            docker rm -f "$TARGET_CONTAINER" || true

            exit 1

          fi

          # ------------------------------------------------------
          # Reload Nginx
          # ------------------------------------------------------

          sudo systemctl reload nginx

          # ------------------------------------------------------
          # Public smoke test
          # ------------------------------------------------------

          echo
          echo "Running post-deployment public smoke test..."

          PUBLIC_OK="false"

          for attempt in {1..15}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              https://aws.ixitek.com/api/health \
              > /tmp/ixitek-public-health.json; then

              if grep -q '"ok":true' /tmp/ixitek-public-health.json && \
                 grep -q '"db":"up"' /tmp/ixitek-public-health.json; then

                PUBLIC_OK="true"
                break

              fi

            fi

            echo "Public smoke test attempt ${attempt}/15 failed."
            sleep 2

          done

          # ------------------------------------------------------
          # SUCCESS
          # ------------------------------------------------------

          if [[ "$PUBLIC_OK" == "true" ]]; then

            echo
            echo "========================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "========================================"

            echo
            echo "Production now serves:"
            echo "$TARGET_ENV"
            echo "$TARGET_CONTAINER"
            echo "$TARGET_PORT"

            echo
            echo "Public health:"
            cat /tmp/ixitek-public-health.json

            # --------------------------------------------------
            # Remove previous environment
            # --------------------------------------------------

            echo
            echo "Removing previous environment..."

            docker rm -f "$ACTIVE_CONTAINER" 2>/dev/null || true

            # --------------------------------------------------
            # Remove legacy container
            # --------------------------------------------------

            if [[ "$ACTIVE_CONTAINER" != "ixitek-app" ]]; then

              echo
              echo "Removing legacy ixitek-app container..."

              docker rm -f ixitek-app 2>/dev/null || true

            fi

            # --------------------------------------------------
            # Docker cleanup
            # --------------------------------------------------

            echo
            echo "Cleaning unused Docker images..."

            docker image prune -af --filter "until=168h" || true

            echo
            echo "Deployment completed successfully."

            exit 0

          fi

          # ------------------------------------------------------
          # AUTOMATIC ROLLBACK
          # ------------------------------------------------------

          echo
          echo "========================================"
          echo "DEPLOYMENT FAILED"
          echo "STARTING AUTOMATIC ROLLBACK"
          echo "========================================"

          echo
          echo "New environment:"
          echo "$TARGET_CONTAINER"
          echo "$TARGET_PORT"

          echo
          echo "Public health response:"
          cat /tmp/ixitek-public-health.json 2>/dev/null || true

          echo
          echo "New container logs:"
          docker logs --tail 150 "$TARGET_CONTAINER" || true

          # ------------------------------------------------------
          # Restore previous upstream
          # ------------------------------------------------------

          echo
          echo "Restoring traffic:"
          echo "$TARGET_PORT -> $ACTIVE_PORT"

          sudo sed -i \
            "s|server 127.0.0.1:${TARGET_PORT};|server 127.0.0.1:${ACTIVE_PORT};|" \
            /etc/nginx/conf.d/ixitek-upstream.conf

          sudo nginx -t
          sudo systemctl reload nginx

          # ------------------------------------------------------
          # Verify rollback
          # ------------------------------------------------------

          echo
          echo "Verifying rollback..."

          ROLLBACK_OK="false"

          for attempt in {1..15}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              https://aws.ixitek.com/api/health \
              > /tmp/ixitek-rollback-health.json; then

              if grep -q '"ok":true' /tmp/ixitek-rollback-health.json && \
                 grep -q '"db":"up"' /tmp/ixitek-rollback-health.json; then

                ROLLBACK_OK="true"
                break

              fi

            fi

            echo "Rollback verification attempt ${attempt}/15 failed."
            sleep 2

          done

          if [[ "$ROLLBACK_OK" == "true" ]]; then

            echo
            echo "========================================"
            echo "ROLLBACK SUCCESSFUL"
            echo "========================================"

            echo
            echo "Old production environment restored:"
            echo "$ACTIVE_CONTAINER"
            echo "$ACTIVE_PORT"

            echo
            echo "Rollback health:"
            cat /tmp/ixitek-rollback-health.json

            echo
            echo "Removing failed new environment..."

            docker rm -f "$TARGET_CONTAINER" || true

            exit 1

          fi

          echo
          echo "CRITICAL ERROR:"
          echo "Deployment failed AND rollback verification failed."

          echo
          echo "DO NOT CLEAN UP ANY MORE CONTAINERS."
          echo "Manual investigation is required."

          exit 2

          REMOTE_SCRIPT

          # Replace only the image placeholder.
          # No GitHub secret is placed in this script.
          python3 - <<PY
          from pathlib import Path

          path = Path("/tmp/ixitek-deploy.sh")
          content = path.read_text()

          content = content.replace(
              "__IXITEK_IMAGE__",
              "${IMAGE}"
          )

          path.write_text(content)
          PY

          chmod 700 /tmp/ixitek-deploy.sh

      # --------------------------------------------------------
      # Send deployment script through SSM
      # --------------------------------------------------------

      - name: Send deployment command to EC2
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
        run: |

          set -Eeuo pipefail

          echo "Encoding deployment script..."

          SCRIPT_B64="$(base64 -w 0 /tmp/ixitek-deploy.sh)"

          COMMAND_JSON="$(
            python3 - "$SCRIPT_B64" <<'PY'
          import json
          import sys

          script_b64 = sys.argv[1]

          commands = [
              "echo '" + script_b64 + "' | base64 -d > /tmp/ixitek-deploy.sh",
              "chmod 700 /tmp/ixitek-deploy.sh",
              "bash /tmp/ixitek-deploy.sh"
          ]

          print(json.dumps({"commands": commands}))
          PY
          )"

          echo "Sending command through AWS Systems Manager..."

          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "$COMMAND_JSON" \
              --comment "Ixitek production deployment $GITHUB_SHA" \
              --query "Command.CommandId" \
              --output text
          )"

          echo
          echo "SSM Command ID:"
          echo "$COMMAND_ID"

          echo "$COMMAND_ID" > /tmp/ixitek-command-id

      # --------------------------------------------------------
      # Wait for deployment result
      # --------------------------------------------------------

      - name: Wait for deployment
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
        run: |

          set -Eeuo pipefail

          COMMAND_ID="$(cat /tmp/ixitek-command-id)"

          echo
          echo "Waiting for EC2 deployment..."

          for attempt in {1..120}; do

            STATUS="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            echo "SSM status ${attempt}/120: $STATUS"

            case "$STATUS" in

              Success)

                echo
                echo "========================================"
                echo "DEPLOYMENT SUCCESSFUL"
                echo "========================================"

                echo
                echo "EC2 deployment output:"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|TimedOut|Cancelled|Cancelling|Undeliverable|Terminated)

                echo
                echo "========================================"
                echo "DEPLOYMENT FAILED"
                echo "========================================"

                echo
                echo "Final status:"
                echo "$STATUS"

                echo
                echo "Standard output:"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo
                echo "Standard error:"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;

              Pending|InProgress|"")
                sleep 5
                ;;

              *)
                sleep 5
                ;;

            esac

          done

          echo
          echo "ERROR: Timed out waiting for SSM deployment."

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "[Status,StatusDetails,StandardOutputContent,StandardErrorContent]" \
            --output text || true

          exit 1
