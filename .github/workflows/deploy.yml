# NOTE (one-Node-app deployment): this workflow predates the current
# deployment model. The project is now deployed as ONE Hostinger Node.js
# Web App, connected directly to this GitHub repo — Hostinger itself pulls
# `main`, runs the root build command, and starts ixitek-backend, which
# serves both the API and the built frontend from https://ixitek.com (see
# the root README's "Deploying to Hostinger" section). That means this
# workflow's job — SFTP-uploading only ixitek-frontend/dist to
# public_html/ as a static site — is no longer part of the deployment
# path, and would fight with it if it also ran on every push (two
# different things updating the same domain). It's kept, disabled from
# auto-running, only in case you ever want a manual one-off static upload;
# trigger it by hand from the Actions tab. Delete this file entirely once
# you're confident you won't need that fallback.
name: (Legacy, manual only) Static frontend-only deploy via SFTP

on:
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ixitek-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ixitek-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Deploy dist to Hostinger via SFTP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT }}
          source: "ixitek-frontend/dist/*,ixitek-frontend/dist/.htaccess"
          target: "/home/u935782097/domains/ixitek.com/public_html/"
          strip_components: 2
          overwrite: true
